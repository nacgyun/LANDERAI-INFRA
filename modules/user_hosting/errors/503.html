<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>잠시 후 다시 접속해 주세요 | LANDERAI</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #0f172a; font-family: system-ui, sans-serif; }
    main { width: 100%; max-width: 520px; text-align: center; }
    .brand { display: inline-block; color: #475569; font-size: 24px; font-weight: 700; letter-spacing: 2px; text-decoration: none; }
    .brand:focus-visible { outline: 2px solid #059669; outline-offset: 6px; border-radius: 4px; }
    .code { margin: 32px 0 12px; color: #059669; font-size: 64px; font-weight: 800; }
    h1 { margin: 0 0 16px; font-size: clamp(22px, 5vw, 30px); word-break: keep-all; }
    .description { color: #475569; line-height: 1.8; word-break: keep-all; }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="${main_page_url}" aria-label="LANDERAI 메인 페이지로 이동">LANDERAI</a>
    <p class="code">503</p>
    <h1>잠시 후 다시 접속해 주세요</h1>
    <p class="description">일시적인 문제로 페이지를 불러오지 못했습니다.<br>잠시 기다린 뒤 새로고침해 주세요.</p>
  </main>
</body>
</html>
